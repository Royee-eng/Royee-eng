name: Refresh contributions

on:
  schedule:
    - cron: '17 6 * * *' # Daily at 06:17 UTC; schedules can be delayed by GitHub.
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_contributions.py'
      - 'tests/test_contributions.py'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile repository
        # Official actions/checkout v4.3.1 release, verified against its commit.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check source validation and failure behavior
        run: python3 -m unittest discover -s tests -p 'test_contributions.py' -v

      - name: Fetch the real contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/update_contributions.py

      - name: Save a successful snapshot
        run: |
          git add -- assets/contributions.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh GitHub contribution snapshot'
          git push
